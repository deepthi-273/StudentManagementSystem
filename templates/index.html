<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <div class="card shadow p-5">

        <h1 class="text-center mb-4">
            Student Management System
        </h1>
<div class="row mb-4">

    <div class="col-md-3">

        <div class="card text-center shadow">

            <div class="card-body">

                <h5>Total Students</h5>

                <h1>{{ total_students }}</h1>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card text-center shadow">

            <div class="card-body">

                <h5>BCA Students</h5>

                <h1>{{ bca_students }}</h1>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card text-center shadow">

            <div class="card-body">

                <h5>BSc Students</h5>

                <h1>{{ bsc_students }}</h1>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card text-center shadow">

            <div class="card-body">

                <h5>BCom Students</h5>

                <h1>{{ bcom_students }}</h1>

            </div>

        </div>

    </div>

</div>
        <div class="text-center">

            <a href="/students"
               class="btn btn-primary">
                View Students
            </a>

            <a href="/add-student"
               class="btn btn-success">
                Add Student
            </a>

        </div>

    </div>

</div>

</body>
</html>
